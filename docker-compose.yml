version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: mean_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: mean_backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/crud_db
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: mean_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
