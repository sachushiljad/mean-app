name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ----- Docker Login -----
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ----- Build Frontend -----
    - name: Build frontend image
      run: |
        cd frontend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest .

    # ----- Build Backend -----
    - name: Build backend image
      run: |
        cd backend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest .

    # ----- Push Images -----
    - name: Push frontend image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest

    - name: Push backend image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest

    # ----- Deploy to EC2 -----
    - name: SSH into EC2 & deploy containers
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Stop and remove all containers
          docker stop $(docker ps -q) || true
          docker rm $(docker ps -aq) || true

          # Remove old network if exists
          docker network rm mean-network || true
          docker network create mean-network

          # Pull latest images
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest

          # Run containers
          docker run -d --name mean-mongo --network mean-network -p 27017:27017 mongo:6.0
          docker run -d --name mean-backend --network mean-network -p 3000:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest
          docker run -d --name mean-frontend --network mean-network -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest
